name: Enterprise CI Pipeline & Quality Gate

on:
  push:
    branches: [main, master, develop, "database-migrate-**", "bug-ui-fixes", "**"]
  pull_request:
    branches: [main, master, develop, "bug-ui-fixes"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  backend-gate:
    name: Backend Tests, Migrations & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Dependencies
        timeout-minutes: 10
        run: |
          npm ci || npm install
          npm ci --prefix backend || npm install --prefix backend

      - name: Database Schema & Migrations Verification
        timeout-minutes: 5
        run: node backend/src/db/migrate.js --if-configured

      - name: Run Backend Unit Tests & 90% Coverage Gate
        timeout-minutes: 10
        run: npm run test:coverage --prefix backend

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: backend-coverage
          path: backend/coverage/**
          if-no-files-found: warn

  frontend-gate:
    name: Frontend Build, Lint, Typecheck & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Dependencies
        timeout-minutes: 10
        run: |
          npm ci || npm install
          npm ci --prefix frontend || npm install --prefix frontend

      - name: TypeScript Typecheck
        timeout-minutes: 5
        run: npm run typecheck --prefix frontend

      - name: ESLint Static Analysis
        timeout-minutes: 5
        run: npm run lint --prefix frontend

      - name: Next.js Production Build
        timeout-minutes: 10
        run: npm run build --prefix frontend

      - name: Run Frontend Unit Tests & 90% Coverage Gate
        timeout-minutes: 15
        run: npm run test:coverage --prefix frontend

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: frontend-coverage
          path: frontend/coverage/**
          if-no-files-found: warn

  quality-summary:
    name: Master Quality & PR Summary
    needs: [backend-gate, frontend-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 20.x

      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: backend-coverage
          path: backend/coverage
        continue-on-error: true

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      - name: Verify Master Coverage Gate
        timeout-minutes: 5
        run: npm run check:coverage
        continue-on-error: true

      - name: Post PR Summary Comment
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            let summaryMarkdown = '';
            try {
              const summaryScript = path.resolve('scripts/generate-ci-summary.js');
              summaryMarkdown = execSync(`node ${summaryScript}`, { encoding: 'utf8' });
            } catch (err) {
              summaryMarkdown = '## 🚀 Quality Gate Execution Completed';
            }

            const botCommentIdentifier = '<!-- procucev-ci-summary-comment -->';
            const body = `${botCommentIdentifier}\n${summaryMarkdown}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find((c) => c.body && c.body.includes(botCommentIdentifier));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
