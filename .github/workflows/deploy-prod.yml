name: Deploy to Cloudflare (Production)

on:
  push:
    branches:
      - prod
      - 'prod-*'
      - 'prod/**'
      - production
      - 'production-*'
      - 'production/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Cloudflare Production Environment
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm ci --prefix frontend --legacy-peer-deps || npm install --prefix frontend --legacy-peer-deps
          npm ci --prefix backend --legacy-peer-deps || npm install --prefix backend --legacy-peer-deps

      - name: Enforce Workspace Unit Tests & 90% Per-File Coverage
        run: npm run test:coverage

      - name: Verify Coverage Against Every Application Source File
        run: npm run check:coverage

      - name: Upload Coverage & Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-coverage
          path: |
            backend/coverage/
            frontend/coverage/
          if-no-files-found: error

      - name: Build Frontend (Vinext)
        run: npm run build:vinext
        env:
          WRANGLER_ENV: prod
        working-directory: frontend

      - name: Deploy Frontend to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare (Production Environment)
        run: npx wrangler deploy --env prod
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
