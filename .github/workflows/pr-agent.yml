name: Gemini PR Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: google-github-actions/run-gemini-cli@main # <--- Changed v1 to main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: "gemini-2.0-flash"
          prompt: |
            You are a senior software engineering reviewer. 
            Analyze the Pull Request code diff provided and post a concise review.