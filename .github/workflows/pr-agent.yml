name: Direct Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff & Run Gemini Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Generate Git Diff
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt
          head -n 2000 pr_diff.txt > trimmed_diff.txt

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set or empty!"
          fi

          # 2. Call Gemini API
          PAYLOAD=$(jq -n --rawfile diff trimmed_diff.txt '{
            contents: [{
              parts: [{
                text: ("You are a senior developer. Review this Git PR diff concisely for bugs, security risks, or code quality issues:\n\n" + $diff)
              }]
            }]
          }')

          HTTP_STATUS=$(curl -s -o gemini_response.json -w "%{http_code}" -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          RESPONSE=$(cat gemini_response.json 2>/dev/null || true)
          echo "=== Gemini API Response (HTTP $HTTP_STATUS) ==="
          echo "$RESPONSE"

          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null)
          FINISH_REASON=$(echo "$RESPONSE" | jq -r '.candidates[0].finishReason // empty' 2>/dev/null)
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)

          if [ -z "$REVIEW_TEXT" ]; then
            if [ -n "$ERROR_MSG" ]; then
              REVIEW_TEXT=$(printf "### ⚠️ Gemini Review Error (HTTP %s)\n\n**Reason:** %s" "$HTTP_STATUS" "$ERROR_MSG")
            elif [ -n "$FINISH_REASON" ] && [ "$FINISH_REASON" != "STOP" ]; then
              REVIEW_TEXT=$(printf "### ⚠️ Gemini Review Incomplete\n\n**Finish Reason:** %s" "$FINISH_REASON")
            else
              REVIEW_TEXT=$(printf "### ⚠️ Gemini Review Failed (HTTP %s)\n\n**Raw API Response:**\n\`\`\`json\n%s\n\`\`\`" "$HTTP_STATUS" "$RESPONSE")
            fi
          fi

          # 3. Post Comment to PR
          jq -n --arg body "$REVIEW_TEXT" '{body: $body}' | curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d @-