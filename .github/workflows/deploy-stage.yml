name: Deploy to Cloudflare (stage Environment)

on:
  push:
    branches:
      - stage
      - 'stage-*'
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to Cloudflare Development Environment
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 30

    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: |
          npm ci --include=optional --legacy-peer-deps || npm install --include=optional --legacy-peer-deps
          npm ci --include=optional --prefix frontend --legacy-peer-deps || npm install --include=optional --prefix frontend --legacy-peer-deps
          npm ci --include=optional --prefix backend --legacy-peer-deps || npm install --include=optional --prefix backend --legacy-peer-deps

      - name: Enforce Workspace Unit Tests & 90% Per-File Coverage
        run: npm run test:coverage

      - name: Verify Coverage Against Every Application Source File
        run: npm run check:coverage

      - name: Upload Coverage & Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-deployment-coverage
          path: |
            backend/coverage/
            frontend/coverage/
          if-no-files-found: error

      - name: Build Frontend (Vinext)
        run: npm run build:vinext
        env:
          WRANGLER_ENV: dev
        working-directory: frontend

      - name: Deploy Frontend to Cloudflare (Stage Environment)
        run: >
          npx wrangler deploy
          --config dist/server/wrangler.json
          --name procucev-enterprise-frontend-stage
          --var NODE_BACKEND_URL:https://procucev-enterprise-backend-stage.srinivas-mukku.workers.dev
          --var NEXT_PUBLIC_BACKEND_URL:https://procucev-enterprise-backend-stage.srinivas-mukku.workers.dev
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare (Stage Environment)
        run: npx wrangler deploy --config wrangler.jsonc --env dev
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
